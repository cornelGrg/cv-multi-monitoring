# Phase 4 demo — calibrated per-camera ROI and directional line-crossing analytics.
# Coordinates are normalized on the 640x640 letterboxed model canvas.  Each
# polygon follows the driveable road envelope.  A single polygon necessarily
# contains the thin central divider; lines are finite gates across one
# carriageway, never lane borders.

model:
  path: "models/yolo26m.onnx"
  input_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.45

inference:
  provider: "CUDAExecutionProvider"
  require_provider: true
  device_id: 0
  batch_size: 4

pipeline:
  queue_maxsize: 10
  max_frames_per_stream: 0
  frame_drop_policy: "latest"
  warmup_batches: 3
  source_fps: 25.0
  loop_video: true
  max_duration_s: 60.0
  allowed_classes: [2, 3, 5, 7]
  audit_frames: 0

tracking:
  enabled: true
  tracker_type: "bytetrack"
  frame_rate: 25.0
  track_buffer: 30
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  match_thresh: 0.8
  fuse_score: true
  write_annotated_video: true
  write_tracks_csv: true
  video_queue_maxsize: 8
  video_drop_policy: "latest"
  annotated_video_dir: "outputs/phase4_demo"
  tracks_file: "outputs/phase4_demo/tracks.csv"

analytics:
  enabled: true
  normalized_coordinates: true
  state_ttl_ms: 10000
  # Zero tolerance avoids the observed slow-crossing misses in the tolerance band.
  # Selected after saved-track replay; fresh-run count validation is still needed.
  side_epsilon: 0.0
  write_csv: true
  events_file: "outputs/phase4_demo/events.csv"
  counts_file: "outputs/phase4_demo/counts.csv"
  cameras:
    # MVI_20011.  The concave left edge removes the bus shelter, stairs and
    # sidewalk.  The near/left carriageway travels down; the far/right one up.
    cam_01:
      roi:
        - [0.52, 0.24]
        - [0.70, 0.24]
        - [0.995, 0.34]
        - [0.995, 0.78]
        - [0.33, 0.78]
        - [0.45, 0.46]
      lines:
        - line_id: "toward_camera_main"
          p1: [0.38, 0.66]
          p2: [0.98, 0.66]
          crossing_direction: "negative_to_positive"
          direction_label: "toward_camera"
          lane_label: "near_carriageway"
          allowed_classes: [car, motorcycle, bus, truck]
        - line_id: "away_from_camera_main"
          p1: [0.72, 0.34]
          p2: [0.99, 0.34]
          crossing_direction: "positive_to_negative"
          direction_label: "away_from_camera"
          lane_label: "far_carriageway"
          allowed_classes: [car, motorcycle, bus, truck]
    # MVI_20012.  The stepped left boundary excludes the bus stop, sidewalk
    # and stairwell while retaining the two usable carriageways.
    cam_02:
      roi:
        - [0.49, 0.24]
        - [0.74, 0.24]
        - [1.00, 0.30]
        - [1.00, 0.78]
        - [0.29, 0.78]
        - [0.34, 0.62]
        - [0.41, 0.45]

      lines:
        - line_id: "toward_camera_main"
          p1: [0.34, 0.64]
          p2: [0.99, 0.64]
          crossing_direction: "negative_to_positive"
          direction_label: "toward_camera"
          lane_label: "near_carriageway"
          allowed_classes: [car, motorcycle, bus, truck]
        - line_id: "away_from_camera_main"
          p1: [0.69, 0.30]
          p2: [0.99, 0.30]
          crossing_direction: "positive_to_negative"
          direction_label: "away_from_camera"
          lane_label: "far_carriageway"
          allowed_classes: [car, motorcycle, bus, truck]
    # MVI_20032.  The six-point contour follows the nearly vertical road and
    # omits both sidewalks.  Gates stop just before/after the central divider.
    cam_03:
      roi:
        - [0.48, 0.28]
        - [0.63, 0.28]
        - [1.00, 0.50]
        - [1.00, 0.78]
        - [0.00, 0.78]
        - [0.00, 0.70]
        - [0.23, 0.50]
      lines:
        - line_id: "toward_camera_main"
          p1: [0.05, 0.66]
          p2: [0.56, 0.66]
          crossing_direction: "negative_to_positive"
          direction_label: "toward_camera"
          lane_label: "near_carriageway"
          allowed_classes: [car, motorcycle, bus, truck]
        - line_id: "away_from_camera_main"
          p1: [0.59, 0.51]
          p2: [0.98, 0.51]
          crossing_direction: "positive_to_negative"
          direction_label: "away_from_camera"
          lane_label: "far_carriageway"
          allowed_classes: [car, motorcycle, bus, truck]
    # MVI_20052.  This contour excludes the bus stop/sidewalk on the left and
    # the non-road corner at upper right.  The near carriageway broadens below.
    cam_04:
      roi:
        - [0.54, 0.24]
        - [0.81, 0.24]
        - [1.00, 0.33]
        - [1.00, 0.78]
        - [0.09, 0.78]
      lines:
        - line_id: "toward_camera_main"
          p1: [0.20, 0.66]
          p2: [0.78, 0.66]
          crossing_direction: "negative_to_positive"
          direction_label: "toward_camera"
          lane_label: "near_carriageway"
          allowed_classes: [car, motorcycle, bus, truck]
        - line_id: "away_from_camera_main"
          p1: [0.71, 0.32]
          p2: [0.97, 0.32]
          crossing_direction: "positive_to_negative"
          direction_label: "away_from_camera"
          lane_label: "far_carriageway"
          allowed_classes: [car, motorcycle, bus, truck]

manifest_file: "data/manifests/ua_detrac_selected.yaml"

output:
  show_detections: true  # Overlay accepted detections in cyan alongside yellow tracks.
  metrics_file: "outputs/phase4_demo/metrics.json"
  video_encoder: "h264_nvenc"
  log_level: "INFO"
