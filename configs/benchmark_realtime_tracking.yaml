# Phase 3 / B6 — 60-second constant-load realtime benchmark with ByteTrack.
# The Phase 2.1 benchmark configuration is intentionally left unchanged.

model:
  path: "models/yolo26m.onnx"
  input_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.45

inference:
  provider: "CUDAExecutionProvider"
  require_provider: true
  device_id: 0
  batch_size: 4

pipeline:
  queue_maxsize: 10
  max_frames_per_stream: 0
  frame_drop_policy: "latest"
  warmup_batches: 3
  source_fps: 25.0
  loop_video: true
  max_duration_s: 60.0
  allowed_classes: [2, 3, 5, 7]
  audit_frames: 0

tracking:
  enabled: true
  tracker_type: "bytetrack"
  frame_rate: 25.0
  track_buffer: 30
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  match_thresh: 0.8
  fuse_score: true
  write_annotated_video: true
  write_tracks_csv: true
  video_queue_maxsize: 8
  video_drop_policy: "latest"
  annotated_video_dir: "outputs/tracking_benchmark"
  tracks_file: "outputs/tracking_benchmark/tracks.csv"

manifest_file: "data/manifests/ua_detrac_selected.yaml"

output:
  metrics_file: "outputs/tracking_benchmark/metrics.json"
  video_encoder: "h264_nvenc"   # Fail fast unless demo encoding uses the GPU.
  log_level: "INFO"
