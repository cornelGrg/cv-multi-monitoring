# ─────────────────────────────────────────────────────────────────────────────
# cv-multi-monitoring — Benchmark Configuration (Replicated Streams)
# ─────────────────────────────────────────────────────────────────────────────
# Replicates the original benchmark: 150 frames per stream, 600 total.
# Uses the same clip replicated 4x (simulated_streams).

model:
  path: "models/yolo26m.onnx"
  input_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.45

inference:
  provider: "CUDAExecutionProvider"
  device_id: 0
  batch_size: 4

pipeline:
  queue_maxsize: 10
  max_frames_per_stream: 150    # Fixed 150 frames for reproducible benchmark
  frame_drop_policy: "none"     # No dropping during benchmark — process every frame
  warmup_batches: 3

streams:
  - camera_id: "sim_01"
    path: "data/videos/stream1.mp4"
  - camera_id: "sim_02"
    path: "data/videos/stream2.mp4"
  - camera_id: "sim_03"
    path: "data/videos/stream3.mp4"
  - camera_id: "sim_04"
    path: "data/videos/stream4.mp4"

output:
  metrics_file: "outputs/benchmark_metrics.json"
  log_level: "INFO"
