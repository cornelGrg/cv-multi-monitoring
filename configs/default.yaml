# ─────────────────────────────────────────────────────────────────────────────
# cv-multi-monitoring — Default Configuration
# ─────────────────────────────────────────────────────────────────────────────

model:
  path: "models/yolo26m.onnx"
  input_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.45

inference:
  provider: "CUDAExecutionProvider"
  device_id: 0
  batch_size: 4

pipeline:
  queue_maxsize: 10
  max_frames_per_stream: 0      # 0 = process all frames in the video
  frame_drop_policy: "latest"   # "latest" = drop oldest frame when queue full
  warmup_batches: 3

# cameras_config_dir: "configs/cameras/"
manifest_file: "data/manifests/ua_detrac_selected.yaml"

output:
  metrics_file: "outputs/metrics.json"
  log_level: "INFO"
