# ─────────────────────────────────────────────────────────────────────────────
# cv-multi-monitoring — Default Configuration
# ─────────────────────────────────────────────────────────────────────────────

model:
  path: "models/yolo26m.onnx"
  input_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.45

inference:
  provider: "CUDAExecutionProvider"
  device_id: 0
  batch_size: 4

pipeline:
  queue_maxsize: 10
  max_frames_per_stream: 0      # 0 = process all frames in the video
  frame_drop_policy: "latest"   # "latest" = drop oldest frame when queue full
  warmup_batches: 3

streams:
  - camera_id: "cam_01"
    path: "data/videos/stream1.mp4"
  - camera_id: "cam_02"
    path: "data/videos/stream2.mp4"
  - camera_id: "cam_03"
    path: "data/videos/stream3.mp4"
  - camera_id: "cam_04"
    path: "data/videos/stream4.mp4"

output:
  metrics_file: "outputs/metrics.json"
  log_level: "INFO"
